name: Socket regression
on:
  push:
    paths: ['TeamOFYServer/**', 'tools/benchmark/**', '.github/workflows/socket-regression.yml']
  pull_request:
    paths: ['TeamOFYServer/**', 'tools/benchmark/**', '.github/workflows/socket-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-sockets:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/benchmark/requirements.txt
      - name: Build isolated loopback server
        run: python tools/benchmark/build.py --out .bench-work/candidate --port 39092
      - name: Verify framing and room delivery
        run: python tools/benchmark/regression.py --build .bench-work/candidate --out .bench-work/regression
      - name: Verify partial writes, ordering and queue bounds
        run: python tools/benchmark/test_output.py --out .bench-work/output-unit
      - name: Verify logout, invalid input and connection churn
        run: python tools/benchmark/lifecycle.py --build .bench-work/candidate --out .bench-work/lifecycle
      - name: Verify slow-reader isolation
        run: python tools/benchmark/backpressure.py --candidate .bench-work/candidate --out .bench-work/pressure --repeats 1 --pressure-only --check
      - name: Verify cached damage through real sockets
        run: python tools/benchmark/hit_regression.py --build .bench-work/candidate --out .bench-work/hit
      - name: Verify startup attack table and concurrent reads
        run: python tools/benchmark/stats_lookup.py --candidate .bench-work/candidate --out .bench-work/lookup --check-only
      - name: Save regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-regression-results
          path: |
            .bench-work/candidate/build.log
            .bench-work/regression/results.json
            .bench-work/output-unit/results.txt
            .bench-work/lifecycle/results.json
            .bench-work/pressure/results.json
            .bench-work/hit/results.json
            .bench-work/lookup/checks.txt
